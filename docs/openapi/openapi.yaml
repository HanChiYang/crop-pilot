        quantity:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1000000000
          description: 依批次庫存單位填寫實際施用的資材用量，最多六位小數。
    MaterialApplicationDetailRsDto:
      type: object
      required: [id, materialId, materialPurchaseLotId, materialType, materialName, applicationMethod, quantity, unit, unitPrice, currencyCode]
      properties:
        id:
          type: string
          format: uuid
        materialId:
          type: string
          format: uuid
        materialPurchaseLotId:
          type: string
          format: uuid
        materialType:
          type: string
          enum: [fertilizer, pesticide]
          description: 由批次所屬資材取得。
        materialName:
          type: string
          minLength: 1
          maxLength: 100
        applicationMethod:
          $ref: '#/components/schemas/MaterialApplicationMethod'
        quantity:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1000000000
          description: 依批次庫存單位填寫實際施用的資材用量，最多六位小數。
        unit:
          type: string
          minLength: 1
          maxLength: 20
          description: 作業當時的庫存單位快照。
        unitPrice:
          type: [number, 'null']
          minimum: 0
          description: 作業採用的單價快照。null 表示成本待補。
          exclusiveMaximum: 1000000000
        currencyCode:
          type: string
          enum: [TWD]
    PesticideStockUnit:
      type: string
      enum: [liter, milliliter, kilogram, gram]
      description: 依序對應公升、毫升、公斤、公克。
    CreatePesticideMaterialRqDto:
      type: object
      required: [name, stockUnit]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        stockUnit:
          $ref: '#/components/schemas/PesticideStockUnit'
    PesticideMaterialRsDto:
      type: object
      required: [id, name, stockUnit, remainingQuantity]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        stockUnit:
          $ref: '#/components/schemas/PesticideStockUnit'
        remainingQuantity:
          type: number
          minimum: 0
    CreatePesticideLotRqDto:
      type: object
      description: 進貨必填 purchasedOn 與 unitPrice，availableFrom 由伺服器取購買日。期初可省略 purchasedOn，availableFrom 省略時取台北當日。
      required: [source, receivedQuantity]
      if:
        required: [source]
        properties:
          source:
            const: purchase
      then:
        required: [purchasedOn, unitPrice]
        properties:
          purchasedOn:
            type: string
          unitPrice:
            type: number
      properties:
        source:
          type: string
          enum: [purchase, openingStock]
        receivedQuantity:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1000000000
          description: 最多六位小數。
        unitPrice:
          type: [number, 'null']
          minimum: 0
          exclusiveMaximum: 1000000000
          description: 每一庫存單位的單價，最多六位小數。null 表示未知。
        purchasedOn:
          type: [string, 'null']
          format: date
        availableFrom:
          type: string
          format: date
          description: 進貨採購買日。期初庫存採盤點日。
    PesticideLotRsDto:
      type: object
      required: [id, materialId, source, purchasedOn, availableFrom, receivedQuantity, remainingQuantity, unitPrice, totalCost, currencyCode]
      properties:
        id:
          type: string
          format: uuid
        materialId:
          type: string
          format: uuid
        source:
          type: string
          enum: [purchase, openingStock]
        receivedQuantity:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1000000000
          description: 最多六位小數。
        unitPrice:
          type: [number, 'null']
          minimum: 0
          exclusiveMaximum: 1000000000
          description: 每一庫存單位的單價，最多六位小數。null 表示未知。
        purchasedOn:
          type: [string, 'null']
          format: date
        availableFrom:
          type: string
          format: date
          description: 進貨採購買日。期初庫存採盤點日。
        remainingQuantity:
          type: number
          minimum: 0
        totalCost:
          type: [number, 'null']
          minimum: 0
          description: 登記量乘以每庫存單位單價，使用十進位計算。未知單價時為 null。
        currencyCode:
          type: string
          enum: [TWD]
    CreatePlantingRqDto:
      type: object
      required: [cropName, areaSquareMeters]
      if:
        required: [status]
        properties:
          status:
            const: growing
      then:
        required: [actualPlantingDate]
        properties:
          actualPlantingDate:
            type: string
      properties:
        cropName:
          type: string
          pattern: '^[\s\S]*\S[\s\S]*$'
          maxLength: 120
        areaSquareMeters:
          $ref: '#/components/schemas/PlantingAreaSquareMeters'
        variety:
          type: [string, 'null']
          maxLength: 120
        plannedPlantingDate:
          type: [string, 'null']
          format: date
        actualPlantingDate:
          type: [string, 'null']
          format: date
          description: 栽培中必填。採收中日期未知時可省略或傳 null。
        status:
          type: string
          enum: [planned, growing, harvesting]
          default: planned
        notes:
          type: [string, 'null']
          maxLength: 1000
    EditPlantingRqDto:
      type: object
      required: [cropName, status, areaSquareMeters]
      if:
        properties:
          status:
            enum: [growing, completed]
      then:
        required: [actualPlantingDate]
        properties:
          actualPlantingDate:
            type: string
      properties:
        cropName:
          type: string
          pattern: '^[\s\S]*\S[\s\S]*$'
          maxLength: 120
        areaSquareMeters:
          $ref: '#/components/schemas/PlantingAreaSquareMeters'
        variety:
          type: [string, 'null']
          maxLength: 120
        plannedPlantingDate:
          type: [string, 'null']
          format: date
        actualPlantingDate:
          type: [string, 'null']
          format: date
        status:
          $ref: '#/components/schemas/PlantingStatus'
        notes:
          type: [string, 'null']
          maxLength: 1000
    PlantingAreaSquareMeters:
      type: number
      minimum: 0.0001
      maximum: 9999999999.9999
      multipleOf: 0.0001
    FieldPlantingsRsDto:
      type: object
      required: [areaSquareMeters, allocatedAreaSquareMeters, remainingAreaSquareMeters, plantings]
      properties:
        areaSquareMeters:
          type: number
        allocatedAreaSquareMeters:
          type: number
        remainingAreaSquareMeters:
          type: number
        plantings:
          type: array
          items:
            $ref: '#/components/schemas/PlantingRsDto'
    PlantingRsDto:
      type: object

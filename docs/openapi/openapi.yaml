openapi: 3.1.0
x-stoplight:
  id: a4hkgw8vplej4
info:
  title: CropPilot
  version: '1.0'
  description: 首個桌機切片涵蓋登入、新增田區、栽培紀錄新增與查詢及田區總覽。
  contact:
    name: CropPilot 專案維護
    url: https://github.com/HanChiYang/crop-pilot
    email: example@mail.com
  license:
    name: Apache License, Version 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:4200
    description: 本機 Angular 開發伺服器，將 API 請求轉送至 ASP.NET Core。
tags:
  - name: Auth
    description: 登入、登出、工作階段與防偽權杖。
  - name: Fields
    description: 新增和查詢登入帳號所擁有的田區。
  - name: Materials
    description: 肥料資材與庫存批次
  - name: Overview
    description: 查詢田區及各田區目前的栽培狀況。
  - name: Plantings
    description: 新增和查詢田區的栽培紀錄。
security:
  - BearerAuth: []
paths:
  /api/v1/auth/csrf:
    get:
      tags: [Auth]
      operationId: getCsrfToken
      summary: 取得防偽權杖
      description: 帳密登入、續期或登出前呼叫。伺服器設定供 Angular 讀取的 XSRF-TOKEN Cookie。
      security: []
      responses:
        '204':
          description: 已發送防偽權杖
          headers:
            Set-Cookie:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 以 CropPilot 帳號密碼登入
      description: 使用帳號、密碼和防偽權杖送出登入請求。登入成功時回傳短效 Access Token 並設定續期 Cookie。
      security:
        - CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRqDto'
      responses:
        '200':
          description: 已登入，回傳 Access Token 並設定續期 Cookie。
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenRsDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 帳號或密碼錯誤
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemRsDto'
        '409':
          description: 原登入工作階段已被另一個請求撤銷或取代。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemRsDto'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/google:
    get:
      tags: [Auth]
      operationId: startGoogleSignIn
      summary: 開始 Google 登入
      description: 由瀏覽器整頁導覽至此，伺服器啟動 OpenID Connect 授權碼與 PKCE 流程。Google 回呼由 ASP.NET Core 中介軟體處理。
      security: []
      responses:
        '302':
          description: 跳轉到 Google；無法開始登入時返回 CropPilot 登入頁並顯示提示。
          headers:
            Location:
              required: true
              schema:
                type: string
  /api/v1/auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: 確認登入工作階段
      description: 驗證 Bearer JWT 的簽章、簽發者、適用對象與效期。有效時回傳 204。
      security:
        - BearerAuth: []
      responses:
        '204':
          description: 目前工作階段有效
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      summary: 續發 Access Token
      description: 使用有效的續期 Cookie 與防偽權杖簽發新的短效 Access Token。續期不延長工作階段期限。
      security:
        - RenewalCookie: []
          CsrfToken: []
      responses:
        '200':
          description: 已簽發新的 Access Token。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenRsDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 登出
      description: 驗證續期 Cookie 與防偽權杖後，撤銷指定的工作階段並清除續期 Cookie。已簽發的 Access Token 在原定時間到期。
      security:
        - RenewalCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRqDto'
      responses:
        '204':
          description: 已登出並清除續期 Cookie
          headers:
            Set-Cookie:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 續期 Cookie 已切換至另一個工作階段。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemRsDto'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/fields:
    get:
      tags: [Fields]
      operationId: getFields
      summary: 列出自己的田區清單
      description: 需要 USER 角色。回傳登入帳號所擁有的田區。尚未建立田區時回傳空陣列。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 田區列表。尚無田區時 fields 為空陣列。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldRsDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Fields]
      operationId: createField
      summary: 新增單筆田區
      description: 需要 USER 角色。擁有者由伺服器依登入身分設定。同帳號的田區名稱去除頭尾空白後不得重複，並區分大小寫。緯度及經度都可留空，填寫時須成對提供。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldRqDto'
            example:
              name: 北側田
              areaSquareMeters: 1200
      responses:
        '201':
          description: 已建立田區。fields 僅含本次建立的一筆田區。
          headers:
            Location:
              description: 新田區的單筆查詢路徑。
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldRsDto'
              example:
                fields:
                  - id: 'f22d8798-25ed-4d15-ae70-a8f9e894dc17'
                    name: 北側田
                    areaSquareMeters: 1200
                    latitude: null
                    longitude: null
                    notes: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: 同帳號已有同名田區。errors.name 提供欄位提示。
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/fields/{fieldId}:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    get:
      tags: [Fields]
      operationId: getField
      summary: 列出自己的田區詳細資料
      description: 需要 USER 角色。依田區識別碼查詢登入帳號的田區。田區不存在或屬於其他帳號時回傳 404。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 田區資料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [Fields]
      operationId: editField
      summary: 編輯單筆田區
      description: 需要 USER 角色。更新登入帳號的指定田區名稱、面積、座標與備註。省略座標或備註會清除對應值。名稱去除頭尾空白後不得與同帳號的其他田區重複，並區分大小寫。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditFieldRqDto'
      responses:
        '200':
          description: 已更新田區。fields 僅含本次更新的一筆田區。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldRsDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 同帳號已有同名田區，或新面積低於已分配面積。errors 以 name 或 areaSquareMeters 標示欄位。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiValidationProblemRsDto'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Fields]
      operationId: deleteField
      summary: 刪除單筆田區
      description: 需要 USER 角色。依路徑上的田區識別碼刪除登入帳號的田區。有任何栽培紀錄的田區禁止刪除。
      security:
        - BearerAuth: []
      responses:
        '204':
          description: 已刪除田區。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: 至少一塊指定田區已有栽培紀錄，刪除未執行。
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/fields/bulk-delete:
    delete:
      tags: [Fields]
      operationId: deleteFields
      summary: 批次刪除田區
      description: 需要 USER 角色。一次刪除指定的田區。任一田區不存在、屬於其他帳號或已有栽培紀錄時，整批保留。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteFieldRqDto'
      responses:
        '204':
          description: 已刪除指定的所有田區。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: 至少一塊指定田區已有栽培紀錄，刪除未執行。
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/fields/{fieldId}/plantings:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    get:
      tags: [Plantings]
      operationId: listFieldPlantings
      summary: 列出指定田區目前的栽培紀錄
      description: 需要 USER 角色。回傳田區面積摘要及規劃中、栽培中與採收中的紀錄。空田區仍回傳面積摘要。田區不存在或屬於其他帳號時回傳 404。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 目前的栽培紀錄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldPlantingsRsDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Plantings]
      operationId: createPlanting
      summary: 新增單筆栽培紀錄
      description: 省略狀態時預設為 planned。選 growing 時必須提供實際栽種日，否則回傳 400。補登 harvesting 時實際栽種日可留空。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlantingRqDto'
            examples:
              planned:
                summary: 新增規劃中紀錄
                value:
                  cropName: 番茄
                  areaSquareMeters: 300
              harvesting:
                summary: 補登採收中紀錄，實際栽種日未知
                value:
                  cropName: 番茄
                  areaSquareMeters: 300
                  status: harvesting
      responses:
        '201':
          description: 已建立栽培紀錄
          headers:
            Location:
              description: 新栽培紀錄的查詢路徑
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantingRsDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: 超過可分配面積或目前狀態不允許更新。errors 以 areaSquareMeters 或 status 標示欄位，超額訊息包含當下可分配面積。
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/plantings/{plantingId}:
    parameters:
      - $ref: '#/components/parameters/PlantingId'
    get:
      tags: [Plantings]
      operationId: getPlanting
      summary: 列出自己的栽培紀錄詳細資料
      description: 依栽培紀錄識別碼查詢。紀錄不存在或所屬田區屬於其他帳號時回傳 404。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 栽培紀錄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantingRsDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [Plantings]
      operationId: editPlanting
      summary: 編輯單筆栽培紀錄
      description: 更新完整表單。已結束的紀錄保留且不可編輯。栽培中及已結束均需實際栽種日。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditPlantingRqDto'
      responses:
        '200':
          description: 已更新的栽培紀錄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantingRsDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: 超過可分配面積或目前狀態不允許更新。errors 以 areaSquareMeters 或 status 標示欄位，超額訊息包含當下可分配面積。
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Plantings]
      operationId: deletePlanting
      summary: 刪除單筆規劃中栽培紀錄
      description: 刪除登入帳號所屬田區的一筆規劃中栽培紀錄，並釋放該筆紀錄占用的面積。
      security:
        - BearerAuth: []
      responses:
        '204':
          description: 已刪除並釋放占用面積
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 只有規劃中的紀錄可以刪除
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemRsDto'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/planting-history:
    get:
      tags: [Plantings]
      operationId: listPlantingHistory
      summary: 依田區及作物查詢已結束栽培紀錄
      description: >-
        需要 USER 角色。後端只查詢登入帳號擁有的已結束紀錄。
        fieldId 和 cropName 可各自省略，同時提供時只回傳符合兩個條件的紀錄。
        省略兩者表示自己的全部田區及作物。
        結果按實際栽種日降冪、紀錄 ID 升冪排列。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlantingHistoryFieldId'
        - name: cropName
          in: query
          description: 選用。傳作物選項回傳的完整名稱，以 1 至 120 個 Unicode 碼點計算，區分大小寫比對。省略表示全部作物。空白或無效名稱回傳 400。
          schema:
            type: string
            pattern: '^[\s\S]*\S[\s\S]*$'
      responses:
        '200':
          description: 符合條件的已結束紀錄。查無資料時回傳空陣列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantingHistoryItemDto'
              example:
                - id: 9d2cf07b-d8d2-4308-9d36-f0ce10504731
                  fieldId: ad31b935-6b1c-4669-8c92-fb1c8489900f
                  fieldName: 北側田
                  cropName: 番茄
                  variety: 玉女
                  actualPlantingDate: '2026-03-12'
                  areaSquareMeters: 240
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/planting-history/crops:
    get:
      tags: [Plantings]
      operationId: listPlantingHistoryCrops
      summary: 載入栽培歷史的作物下拉選項
      description: >-
        需要 USER 角色。進入頁面或切換田區時使用。
        後端依登入帳號、已結束狀態及選用的 fieldId 限定查詢範圍，
        回傳其中的作物名稱，依完整名稱區分大小寫去重並以 PostgreSQL C 定序升冪排列。
        回傳的名稱可作為歷史清單的 cropName 參數。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlantingHistoryFieldId'
      responses:
        '200':
          description: 作物名稱清單。沒有已結束紀錄時回傳空陣列。
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  maxLength: 120
              example: [玉米, 番茄]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/plantings/{plantingId}/irrigations:
    parameters:
      - $ref: '#/components/parameters/PlantingId'
    get:
      tags: [Plantings]
      operationId: listIrrigations
      summary: 查詢單筆栽培的灌溉清單
      security:
        - BearerAuth: []
      description: 按實際灌溉日期、建立時間與識別碼依序由大到小排列。所屬栽培沒有灌溉作業時回傳空陣列。栽培不存在或其田區不屬於登入帳號時回傳 404。
      responses:
        '200':
          description: 灌溉作業清單
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IrrigationRsDto'
        '400':

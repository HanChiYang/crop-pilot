      properties:
        id:
          type: string
          format: uuid
        fieldId:
          type: string
          format: uuid
        areaSquareMeters:
          $ref: '#/components/schemas/PlantingAreaSquareMeters'
        cropName:
          type: string
          maxLength: 120
        variety:
          type: [string, 'null']
          maxLength: 120
        plannedPlantingDate:
          type: [string, 'null']
          format: date
        actualPlantingDate:
          type: [string, 'null']
          format: date
        status:
          $ref: '#/components/schemas/PlantingStatus'
        notes:
          type: [string, 'null']
          maxLength: 1000
    PlantingHistoryItemDto:
      type: object
      required: [id, fieldId, fieldName, cropName, variety, actualPlantingDate, areaSquareMeters]
      properties:
        id:
          type: string
          format: uuid
        fieldId:
          type: string
          format: uuid
        fieldName:
          type: string
          maxLength: 120
          description: 查詢當下的田區名稱。
        cropName:
          type: string
          maxLength: 120
        variety:
          type: [string, 'null']
          maxLength: 120
        actualPlantingDate:
          type: string
          format: date
        areaSquareMeters:
          $ref: '#/components/schemas/PlantingAreaSquareMeters'
    PlantingStatus:
      type: string
      enum: [planned, growing, harvesting, completed]
    FieldOverviewRsDto:
      allOf:
        - $ref: '#/components/schemas/FieldDto'
        - type: object
          required: [plantings]
          properties:
            plantings:
              type: array
              description: 目前栽培紀錄，沒有紀錄時為空陣列。
              items:
                $ref: '#/components/schemas/PlantingRsDto'
    ApiProblemRsDto:
      type: object
      required: [status, title]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
    ApiConflictRsDto:
      allOf:
        - $ref: '#/components/schemas/ApiProblemRsDto'
        - type: object
          properties:
            errors:
              type: object
              description: 以 JSON 欄位名對應錯誤訊息陣列。
              additionalProperties:
                type: array
                items:
                  type: string
    ApiValidationProblemRsDto:
      allOf:
        - $ref: '#/components/schemas/ApiProblemRsDto'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              description: 以 JSON 欄位名對應錯誤訊息陣列。防偽驗證失敗時使用空物件。
              additionalProperties:
                type: array
                items:
                  type: string

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: CropPilot 簽發的 JWT Access Token，效期最多五分鐘。角色反映簽發當下的授權狀態。
    RenewalCookie:
      type: apiKey
      in: cookie
      name: CropPilot.Renewal
      description: 由瀏覽器管理的 HttpOnly 續期 Cookie，用於續期和登出。
    CsrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Angular 從 XSRF-TOKEN Cookie 取得權杖，並在同源寫入請求帶上此標頭。
  parameters:
    PlantingHistoryFieldId:
      name: fieldId
      in: query
      description: 選用。省略表示自己的全部田區。空值或 UUID 格式錯誤回傳 400。指定的田區不存在或屬於其他帳號時回傳 404。
      schema:
        type: string
        format: uuid
    FieldId:
      name: fieldId
      in: path
      description: 田區的 UUID。
      required: true
      schema:
        type: string
        format: uuid
    PlantingId:
      name: plantingId
      in: path
      description: 栽培紀錄的 UUID。
      required: true
      schema:
        type: string
        format: uuid
    MaterialId:
      name: materialId
      in: path
      required: true
      description: 肥料資材識別碼。
      schema:
        type: string
        format: uuid
    LotId:
      name: lotId
      in: path
      required: true
      description: 肥料庫存批次的 UUID。
      schema:
        type: string
        format: uuid
    MaterialApplicationId:
      name: materialApplicationId
      in: path
      description: 施用作業的 UUID。
      required: true
      schema:
        type: string
        format: uuid
    IrrigationId:
      name: irrigationId
      in: path
      required: true
      description: 灌溉作業識別碼
      schema:
        type: string
        format: uuid

  responses:
    Conflict:
      description: 請求與資源目前的狀態衝突。detail 說明原因，有欄位提示時附上 errors。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiConflictRsDto'
    FieldAccessForbidden:
      description: 登入帳號沒有使用田區功能所需的 USER 角色。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblemRsDto'
    BadRequest:
      description: 請求驗證或防偽權杖驗證失敗。欄位錯誤可依 errors 內的 JSON 欄位名顯示。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiValidationProblemRsDto'
    Unauthorized:
      description: 權杖無效、未登入或工作階段已失效
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblemRsDto'
    NotFound:
      description: 資源不存在、類型不符，或資源屬於其他帳號
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblemRsDto'
    ServerError:
      description: 伺服器處理失敗
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblemRsDto'
  schemas:
    AccessTokenRsDto:
      type: object
      required: [accessToken, sessionId]
      properties:
        accessToken:
          type: string
          description: CropPilot 簽發的短效 JWT Bearer Access Token。
        sessionId:
          type: string
          format: uuid
          description: 工作階段識別碼，讓前端辨識續期時是否已切換登入。
    LogoutRqDto:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
          format: uuid
          description: 目前分頁取得 Access Token 時收到的工作階段識別碼。
    LoginRqDto:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: 本地登入帳號。後端去除頭尾空白後，要求至少有一個字元，並區分大小寫比對。
          minLength: 1
          maxLength: 256
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
    CreateFieldRqDto:
      type: object
      required: [name, areaSquareMeters]
      properties:
        name:
          type: string
          pattern: '^[\s\S]*\S[\s\S]*$'
          maxLength: 120
        areaSquareMeters:
          type: number
          description: 平方公尺，最多四位小數。
          exclusiveMinimum: 0
          maximum: 9999999999.9999
          multipleOf: 0.0001
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
          multipleOf: 0.000001
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
          multipleOf: 0.000001
        notes:
          type: [string, 'null']
          maxLength: 1000
    EditFieldRqDto:
      description: 田區的完整編輯資料。
      allOf:
        - $ref: '#/components/schemas/CreateFieldRqDto'
    DeleteFieldRqDto:
      type: object
      required: [fieldIds]
      properties:
        fieldIds:
          type: array
          description: 要刪除的田區 UUID，至少一筆且不得重複。
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
    FieldRsDto:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDto'
    FieldDto:
      type: object
      required: [id, name, areaSquareMeters, latitude, longitude, notes]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        areaSquareMeters:
          type: number
          exclusiveMinimum: 0
          maximum: 9999999999.9999
          multipleOf: 0.0001
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
          multipleOf: 0.000001
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
          multipleOf: 0.000001
        notes:
          type: [string, 'null']
          maxLength: 1000
    CreateFertilizerMaterialRqDto:
      type: object
      required: [name, stockUnit]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        stockUnit:
          type: string
          minLength: 1
          maxLength: 20
    FertilizerMaterialRsDto:
      type: object
      required: [id, name, stockUnit, remainingQuantity]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        stockUnit:
          type: string
          minLength: 1
          maxLength: 20
        remainingQuantity:
          type: number
          minimum: 0
    CreateFertilizerLotRqDto:
      type: object
      description: 進貨必填 purchasedOn，availableFrom 由伺服器取購買日。期初可省略 purchasedOn，availableFrom 省略時取台北當日。
      required: [source, receivedQuantity]
      properties:
        source:
          type: string
          enum: [purchase, openingStock]
        receivedQuantity:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1000000000
          description: 最多六位小數。
        unitPrice:
          type: [number, 'null']
          minimum: 0
          exclusiveMaximum: 1000000000
          description: 每一庫存單位的單價，最多六位小數。null 表示未知。
        purchasedOn:
          type: [string, 'null']
          format: date
        availableFrom:
          type: string
          format: date
          description: 進貨採購買日。期初庫存採盤點日。
    EditFertilizerLotRqDto:
      type: object
      description: 更新原批次。進貨必填 purchasedOn，availableFrom 採購買日。期初庫存省略 availableFrom 時沿用原生效日。省略單價或購買日等選填值時清空該值。
      required: [receivedQuantity]
      properties:
        receivedQuantity:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1000000000
          description: 最多六位小數。
        unitPrice:
          type: [number, 'null']
          minimum: 0
          exclusiveMaximum: 1000000000
          description: 最多六位小數。null 表示未知。
        purchasedOn:
          type: [string, 'null']
          format: date
        availableFrom:
          type: string
          format: date
    FertilizerLotRsDto:
      type: object
      required: [id, materialId, source, purchasedOn, availableFrom, receivedQuantity, remainingQuantity, unitPrice, currencyCode]
      properties:
        id:
          type: string
          format: uuid
        materialId:
          type: string
          format: uuid
        source:
          type: string
          enum: [purchase, openingStock]
        receivedQuantity:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1000000000
          description: 最多六位小數。
        unitPrice:
          type: [number, 'null']
          minimum: 0
          exclusiveMaximum: 1000000000
          description: 每一庫存單位的單價，最多六位小數。null 表示未知。
        purchasedOn:
          type: [string, 'null']
          format: date
        availableFrom:
          type: string
          format: date
          description: 進貨採購買日。期初庫存採盤點日。
        remainingQuantity:
          type: number
          minimum: 0
        currencyCode:
          type: string
          enum: [TWD]
    IrrigationMethod:
      type: string
      enum: [drip, sprinkler, furrow, manual, other]
      description: 依序為滴灌、噴灌、溝灌、人工澆灌、其他。
    SaveIrrigationRqDto:
      type: object
      required: [operationDate, method]
      properties:
        operationDate:
          type: string
          format: date
          description: 實際灌溉日期，最晚為台北當日。
        method:
          $ref: '#/components/schemas/IrrigationMethod'
        waterVolumeLiters:
          type: [number, 'null']
          exclusiveMinimum: 0
          exclusiveMaximum: 1000000000
          description: 用水量，單位為公升，最多六位小數。null 表示未記錄。
        description:
          type: [string, 'null']
          maxLength: 500
          description: 灌溉備註。
    IrrigationRsDto:
      type: object
      required: [id, operationDate, method, waterVolumeLiters, description]
      properties:
        id:
          type: string
          format: uuid
          description: 灌溉作業識別碼。
        operationDate:
          type: string
          format: date
        method:
          $ref: '#/components/schemas/IrrigationMethod'
        waterVolumeLiters:
          type: [number, 'null']
          exclusiveMinimum: 0
          exclusiveMaximum: 1000000000
          description: 用水量，單位為公升。null 表示未記錄。
        description:
          type: [string, 'null']
          maxLength: 500
          description: 灌溉備註。
    MaterialApplicationMethod:
      type: string
      enum: [spray, broadcast]
      description: spray 為噴施，broadcast 為撒施。
    CreateMaterialApplicationRqDto:
      type: object
      required: [operationDate, details]
      if:
        required: [sprayWaterVolumeLiters]
        properties:
          sprayWaterVolumeLiters:
            type: number
      then:
        properties:
          details:
            contains:
              type: object
              required: [applicationMethod]
              properties:
                applicationMethod:
                  const: spray
      properties:
        operationDate:
          type: string
          format: date
          description: 實際施用日期。寫入不得晚於台北當日。
        sprayWaterVolumeLiters:
          type: [number, 'null']
          exclusiveMinimum: 0
          exclusiveMaximum: 1000000000
          multipleOf: 0.000001
          description: 本次噴施明細共用的總水量，單位為公升。至少有一筆噴施明細時才可填寫。null 表示未記錄或無噴施。
        details:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MaterialApplicationDetailRqDto'
    EditMaterialApplicationRqDto:
      type: object
      required: [operationDate, details]
      if:
        required: [sprayWaterVolumeLiters]
        properties:
          sprayWaterVolumeLiters:
            type: number
      then:
        properties:
          details:
            contains:
              type: object
              required: [applicationMethod]
              properties:
                applicationMethod:
                  const: spray
      properties:
        operationDate:
          type: string
          format: date
          description: 實際施用日期。寫入不得晚於台北當日。
        sprayWaterVolumeLiters:
          type: [number, 'null']
          exclusiveMinimum: 0
          exclusiveMaximum: 1000000000
          multipleOf: 0.000001
          description: 本次噴施明細共用的總水量，單位為公升。至少有一筆噴施明細時才可填寫。null 表示未記錄或無噴施。
        details:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EditMaterialApplicationDetailRqDto'
    MaterialApplicationRsDto:
      type: object
      required: [id, operationDate, sprayWaterVolumeLiters, details]
      properties:
        id:
          type: string
          format: uuid
        operationDate:
          type: string
          format: date
          description: 實際施用日期。寫入不得晚於台北當日。
        sprayWaterVolumeLiters:
          type: [number, 'null']
          exclusiveMinimum: 0
          exclusiveMaximum: 1000000000
          multipleOf: 0.000001
          description: 本次噴施明細共用的總水量，單位為公升。至少有一筆噴施明細時才可填寫。null 表示未記錄或無噴施。
        details:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MaterialApplicationDetailRsDto'
    MaterialApplicationDetailRqDto:
      type: object
      required: [materialPurchaseLotId, applicationMethod, quantity]
      properties:
        materialPurchaseLotId:
          type: string
          format: uuid
        applicationMethod:
          $ref: '#/components/schemas/MaterialApplicationMethod'
        quantity:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1000000000
          description: 依批次庫存單位填寫實際施用的資材用量，最多六位小數。
    EditMaterialApplicationDetailRqDto:
      type: object
      required: [materialPurchaseLotId, applicationMethod, quantity]
      properties:
        id:

openapi: 3.1.0
x-stoplight:
  id: a4hkgw8vplej4
info:
  title: CropPilot
  version: '1.0'
  description: 首個桌機切片涵蓋登入、新增田區、栽培紀錄新增與查詢及田區總覽。
  contact:
    name: CropPilot 專案維護
    url: https://github.com/HanChiYang/crop-pilot
    email: example@mail.com
  license:
    name: Apache License, Version 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:4200
    description: 本機 Angular 開發伺服器，將 API 請求轉送至 ASP.NET Core。
tags:
  - name: Auth
    description: 登入、登出、工作階段與防偽權杖。
  - name: Fields
    description: 新增和查詢登入帳號所擁有的田區。
  - name: Overview
    description: 查詢田區及各田區目前的栽培狀況。
  - name: Plantings
    description: 新增和查詢田區的栽培紀錄。
security:
  - BearerAuth: []
paths:
  /api/v1/auth/csrf:
    get:
      tags: [Auth]
      operationId: getCsrfToken
      summary: 取得防偽權杖
      description: 帳密登入、續期或登出前呼叫。伺服器設定供 Angular 讀取的 XSRF-TOKEN Cookie。
      security: []
      responses:
        '204':
          description: 已發送防偽權杖
          headers:
            Set-Cookie:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 以 CropPilot 帳號密碼登入
      description: 使用帳號、密碼和防偽權杖送出登入請求。登入成功時回傳短效 Access Token 並設定續期 Cookie。
      security:
        - CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRqDto'
      responses:
        '200':
          description: 已登入，回傳 Access Token 並設定續期 Cookie。
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenRsDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 帳號或密碼錯誤
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemRsDto'
        '409':
          description: 原登入工作階段已被另一個請求撤銷或取代。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemRsDto'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/google:
    get:
      tags: [Auth]
      operationId: startGoogleSignIn
      summary: 開始 Google 登入
      description: 由瀏覽器整頁導覽至此，伺服器啟動 OpenID Connect 授權碼與 PKCE 流程。Google 回呼由 ASP.NET Core 中介軟體處理。
      security: []
      responses:
        '302':
          description: 跳轉到 Google；無法開始登入時返回 CropPilot 登入頁並顯示提示。
          headers:
            Location:
              required: true
              schema:
                type: string
  /api/v1/auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: 確認登入工作階段
      description: 驗證 Bearer JWT 的簽章、簽發者、適用對象與效期。有效時回傳 204。
      security:
        - BearerAuth: []
      responses:
        '204':
          description: 目前工作階段有效
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      summary: 續發 Access Token
      description: 使用有效的續期 Cookie 與防偽權杖簽發新的短效 Access Token。續期不延長工作階段期限。
      security:
        - RenewalCookie: []
          CsrfToken: []
      responses:
        '200':
          description: 已簽發新的 Access Token。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenRsDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 登出
      description: 驗證續期 Cookie 與防偽權杖後，撤銷指定的工作階段並清除續期 Cookie。已簽發的 Access Token 在原定時間到期。
      security:
        - RenewalCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRqDto'
      responses:
        '204':
          description: 已登出並清除續期 Cookie
          headers:
            Set-Cookie:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 續期 Cookie 已切換至另一個工作階段。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemRsDto'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/fields:
    get:
      tags: [Fields]
      operationId: getFields
      summary: 列出自己的田區清單
      description: 需要 USER 角色。回傳登入帳號所擁有的田區。尚未建立田區時回傳空陣列。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 田區列表。尚無田區時 fields 為空陣列。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldRsDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Fields]
      operationId: createField
      summary: 新增單筆田區
      description: 需要 USER 角色。擁有者由伺服器依登入身分設定。同帳號的田區名稱去除頭尾空白後不得重複，並區分大小寫。緯度及經度都可留空，填寫時須成對提供。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldRqDto'
            example:
              name: 北側田
              areaSquareMeters: 1200
      responses:
        '201':
          description: 已建立田區。fields 僅含本次建立的一筆田區。
          headers:
            Location:
              description: 新田區的單筆查詢路徑。
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldRsDto'
              example:
                fields:
                  - id: 'f22d8798-25ed-4d15-ae70-a8f9e894dc17'
                    name: 北側田
                    areaSquareMeters: 1200
                    latitude: null
                    longitude: null
                    notes: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '409':
          $ref: '#/components/responses/FieldNameConflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/fields/{fieldId}:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    get:
      tags: [Fields]
      operationId: getField
      summary: 列出自己的田區詳細資料
      description: 需要 USER 角色。依田區識別碼查詢登入帳號的田區。田區不存在或屬於其他帳號時回傳 404。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 田區資料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [Fields]
      operationId: editField
      summary: 編輯單筆田區
      description: 需要 USER 角色。更新登入帳號的指定田區名稱、面積、座標與備註。省略座標或備註會清除對應值。名稱去除頭尾空白後不得與同帳號的其他田區重複，並區分大小寫。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditFieldRqDto'
      responses:
        '200':
          description: 已更新田區。fields 僅含本次更新的一筆田區。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldRsDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FieldNameConflict'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Fields]
      operationId: deleteField
      summary: 刪除單筆田區
      description: 需要 USER 角色。依路徑上的田區識別碼刪除登入帳號的田區。有任何栽培紀錄的田區禁止刪除。
      security:
        - BearerAuth: []
      responses:
        '204':
          description: 已刪除田區。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FieldDeleteConflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/fields/bulk-delete:
    delete:
      tags: [Fields]
      operationId: deleteFields
      summary: 批次刪除田區
      description: 需要 USER 角色。一次刪除指定的田區。任一田區不存在、屬於其他帳號或已有栽培紀錄時，整批保留。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteFieldRqDto'
      responses:
        '204':
          description: 已刪除指定的所有田區。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FieldDeleteConflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/fields/{fieldId}/plantings:
    parameters:
      - $ref: '#/components/parameters/FieldId'
    get:
      tags: [Plantings]
      operationId: listFieldPlantings
      summary: 列出指定田區目前的栽培紀錄
      description: 需要 USER 角色。回傳規劃中、栽培中與採收中的紀錄。自己的田區沒有目前紀錄時回傳空陣列。田區不存在或屬於其他帳號時回傳 404。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 目前的栽培紀錄
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantingRsDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Plantings]
      operationId: createPlanting
      summary: 新增單筆栽培紀錄
      description: 省略狀態時預設為 planned。選 growing 時必須提供實際栽種日，否則回傳 400。補登 harvesting 時實際栽種日可留空。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlantingRqDto'
            examples:
              planned:
                summary: 新增規劃中紀錄
                value:
                  cropName: 番茄
              harvesting:
                summary: 補登採收中紀錄，實際栽種日未知
                value:
                  cropName: 番茄
                  status: harvesting
      responses:
        '201':
          description: 已建立栽培紀錄
          headers:
            Location:
              description: 新栽培紀錄的查詢路徑
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantingRsDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/fields/{fieldId}/plantings/{plantingId}:
    parameters:
      - $ref: '#/components/parameters/FieldId'
      - $ref: '#/components/parameters/PlantingId'
    get:
      tags: [Plantings]
      operationId: getPlanting
      summary: 列出自己的栽培紀錄詳細資料
      description: 依田區和栽培紀錄識別碼查詢。田區或紀錄不存在、兩者不相符，或田區屬於其他帳號時回傳 404。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 栽培紀錄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantingRsDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/overview:
    get:
      tags: [Overview]
      operationId: getOverview
      summary: 列出自己的田區清單及目前栽培狀況
      description: 回傳自己的所有田區及各田區的規劃中、栽培中與採收中紀錄。已結束紀錄會保留在資料庫。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 田區總覽。尚無田區時回傳空陣列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FieldOverviewRsDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FieldAccessForbidden'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: CropPilot 簽發的 JWT Access Token，效期最多五分鐘。角色反映簽發當下的授權狀態。
    RenewalCookie:
      type: apiKey
      in: cookie
      name: CropPilot.Renewal
      description: 由瀏覽器管理的 HttpOnly 續期 Cookie，用於續期和登出。
    CsrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Angular 從 XSRF-TOKEN Cookie 取得權杖，並在同源寫入請求帶上此標頭。
  parameters:
    FieldId:
      name: fieldId
      in: path
      description: 田區的 UUID。
      required: true
      schema:
        type: string
        format: uuid
    PlantingId:
      name: plantingId
      in: path
      description: 指定田區下栽培紀錄的 UUID。
      required: true
      schema:
        type: string
        format: uuid
  responses:
    FieldAccessForbidden:
      description: 登入帳號沒有使用田區功能所需的 USER 角色。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblemRsDto'
    FieldNameConflict:
      description: 同帳號已有同名田區。errors.name 提供欄位提示。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiValidationProblemRsDto'
    FieldDeleteConflict:
      description: 至少一塊指定田區已有栽培紀錄，刪除未執行。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblemRsDto'
    BadRequest:
      description: 請求驗證或防偽權杖驗證失敗。欄位錯誤可依 errors 內的 JSON 欄位名顯示。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiValidationProblemRsDto'
    Unauthorized:
      description: 權杖無效、未登入或工作階段已失效
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblemRsDto'
    NotFound:
      description: 資源不存在、栽培紀錄不屬於路徑上的田區，或資源屬於其他帳號
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblemRsDto'
    ServerError:
      description: 伺服器處理失敗
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblemRsDto'
  schemas:
    AccessTokenRsDto:
      type: object
      required: [accessToken, sessionId]
      properties:
        accessToken:
          type: string
          description: CropPilot 簽發的短效 JWT Bearer Access Token。
        sessionId:
          type: string
          format: uuid
          description: 工作階段識別碼，讓前端辨識續期時是否已切換登入。
    LogoutRqDto:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
          format: uuid
          description: 目前分頁取得 Access Token 時收到的工作階段識別碼。
    LoginRqDto:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: 本地登入帳號。後端去除頭尾空白後，要求至少有一個字元，並區分大小寫比對。
          minLength: 1
          maxLength: 256
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
    CreateFieldRqDto:
      type: object
      required: [name, areaSquareMeters]
      properties:
        name:
          type: string
          pattern: '^[\s\S]*\S[\s\S]*$'
          maxLength: 120
        areaSquareMeters:
          type: number
          description: 平方公尺，最多四位小數。
          exclusiveMinimum: 0
          maximum: 9999999999.9999
          multipleOf: 0.0001
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
          multipleOf: 0.000001
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
          multipleOf: 0.000001
        notes:
          type: [string, 'null']
          maxLength: 1000
    EditFieldRqDto:
      description: 田區的完整編輯資料。
      allOf:
        - $ref: '#/components/schemas/CreateFieldRqDto'
    DeleteFieldRqDto:
      type: object
      required: [fieldIds]
      properties:
        fieldIds:
          type: array
          description: 要刪除的田區 UUID，至少一筆且不得重複。
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
    FieldRsDto:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDto'
    FieldDto:
      type: object
      required: [id, name, areaSquareMeters, latitude, longitude, notes]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        areaSquareMeters:
          type: number
          exclusiveMinimum: 0
          maximum: 9999999999.9999
          multipleOf: 0.0001
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
          multipleOf: 0.000001
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
          multipleOf: 0.000001
        notes:
          type: [string, 'null']
          maxLength: 1000
    CreatePlantingRqDto:
      type: object
      required: [cropName]
      if:
        required: [status]
        properties:
          status:
            const: growing
      then:
        required: [actualPlantingDate]
        properties:
          actualPlantingDate:
            type: string
      properties:
        cropName:
          type: string
          pattern: '^[\s\S]*\S[\s\S]*$'
          maxLength: 120
        variety:
          type: [string, 'null']
          maxLength: 120
        plannedPlantingDate:
          type: [string, 'null']
          format: date
        actualPlantingDate:
          type: [string, 'null']
          format: date
          description: 栽培中必填。採收中日期未知時可省略或傳 null。
        status:
          type: string
          enum: [planned, growing, harvesting]
          default: planned
